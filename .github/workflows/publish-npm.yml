name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of an already published GitHub release
        required: true
        type: string
      npm_tag:
        description: npm distribution tag
        required: true
        type: choice
        default: latest
        options: [latest, next, alpha, beta, rc]
      authentication:
        description: Use an npm token for first publication; otherwise use trusted publishing
        required: true
        type: choice
        default: trusted-publishing
        options: [trusted-publishing, npm-token]

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - name: Check out publication tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install publication tools
        run: npm install --global npm@11.15.0 pnpm@11.25.0
      - name: Install tooling dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check first-publication credentials
        if: inputs.authentication == 'npm-token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Create the NPM_TOKEN secret in the npm environment before choosing npm-token authentication.' >&2
            exit 1
          fi
      - name: Verify and publish original release archives
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NPM_TAG: ${{ inputs.npm_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ inputs.authentication == 'npm-token' && secrets.NPM_TOKEN || '' }}
        run: pnpm release:publish-artifacts --version="$RELEASE_VERSION" --tag="$RELEASE_NPM_TAG"
