name: Checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Source and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install repository package manager
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint source
        run: pnpm lint
      - name: Build packages
        run: pnpm build
      - name: Build examples
        run: pnpm build:examples
      - name: Check types
        run: pnpm typecheck
      - name: Test core behavior
        run: pnpm test
      - name: Check package dependencies
        run: pnpm check:packages
      - name: Validate package archives
        run: pnpm check:artifacts
      - name: Check bundle sizes
        run: pnpm check:bundles
      - name: Build packed consumers
        run: pnpm test:consumer
      - name: Generate API reference
        run: pnpm docs:api
      - name: Build documentation
        run: pnpm docs:build
  browser:
    name: Browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HOME: /root
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install repository package manager
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Test browser components
        run: pnpm test:browser
      - name: Test Chromium, Firefox and WebKit integrations
        run: pnpm test:e2e
