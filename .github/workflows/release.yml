name: Publish packages
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Distribution channel
        type: choice
        options: [next, alpha, latest]
        default: next
permissions:
  contents: read
concurrency:
  group: package-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.NPM_PUBLISH_ENABLED == 'true'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm verify
      - run: node scripts/release.mjs --publish --channel="$RELEASE_CHANNEL"
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
