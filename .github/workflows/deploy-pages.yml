name: Deploy documentation and examples

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - examples/**
      - packages/**
      - scripts/package-pages-site.mjs
      - package.json
      - pnpm-lock.yaml
      - typedoc.json
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install repository package manager
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build public documentation and examples
        run: pnpm package:pages
      - name: Name deployment artifact
        id: artifact
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload deployment artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
